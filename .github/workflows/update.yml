name: Auto Filter IPTV Playlist

on:
  schedule:
    # Chạy lúc 00:00 giờ Việt Nam (tương đương 17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Cập nhật v4 mới nhất

    - name: Set up Python
      uses: actions/setup-python@v5  # Cập nhật v5 mới nhất
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run filter script
      # Lưu ý: Thay main.py bên dưới thành tên file .py chính xác của bạn
      run: python update_iptv.py

    - name: Commit and push updated playlist
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist [skip ci]" && git push)
