name: Auto Filter IPTV Playlist

on:
  schedule:
    # Chạy lúc 00:00 giờ Việt Nam (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:

# Cấp quyền Ghi trực tiếp trong workflow
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run filter script
      run: python update_iptv.py

    - name: Commit and push updated playlist
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist [skip ci]" && git push)
