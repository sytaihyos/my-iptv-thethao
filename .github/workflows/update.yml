name: Auto Filter IPTV Playlist

on:
  schedule:
    # 17:00 UTC tương đương 00:00 (0h00) giờ Việt Nam (UTC+7)
    - cron: '0 17 * * *'
  workflow_dispatch: # Cho phép nhấn chạy thủ công bằng tay khi cần

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run filter script
      run: python main.py  # Đổi main.py thành tên file python của bạn nếu khác

    - name: Commit and push updated playlist
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update playlist [skip ci]" && git push)
